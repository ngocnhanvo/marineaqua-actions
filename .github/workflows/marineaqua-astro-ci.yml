name: Marine Aqua Astro source checks (NO DEPLOY)
# Recheck live product-category route and red price listing changes on Astro master.
# Regression checks now include redirect-alias and nested brand route Vitest cases.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-astro-ci.yml'
      - 'scripts/marineaqua-import-home-products.mjs'
      - 'scripts/marineaqua-bind-home-products.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marineaqua-astro-source-checks
  cancel-in-progress: false
jobs:
  astro-checks:
    if: github.repository == 'ngocnhanvo/marineaqua-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify source access token is configured
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: test -n "$SOURCE_REPO_PAT" || { echo "::error::Missing SOURCE_REPO_PAT"; exit 1; }
      - name: Checkout Astro source from owner-required master branch
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/marineaqua-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - name: Record and verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = master
          test -f package.json
          test -f pnpm-lock.yaml
          echo "MARINEAQUA_ASTRO_TEST_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Astro source: $(git rev-parse HEAD) (master)" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact locked dependencies (no production build)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify home product category URLs and stock source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const component=readFileSync('src/astro/components/Home/BrandProductSection.astro','utf8');
          const mapper=readFileSync('src/lib/wordpress/products/getData.ts','utf8');
          assert.match(component,/const moreHref = listingSlug && categorySlug/);
          assert.match(component,/availability === "outofstock"/);
          assert.match(mapper,/item\.class_list\.includes\("outofstock"\)/);
          assert.match(mapper,/stockStatus: initI18n\(stockStatus\)/);
          console.log('HOME_PRODUCT_LINK_AND_STOCK_SOURCE=PASS');
          NODE
      - name: Verify WordPress-owned marine footer source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const footer=readFileSync('src/astro/components/Layout/Footer.astro','utf8');
          const css=readFileSync('src/styles/marine-aqua-approved.css','utf8');
          assert.match(footer,/data-marine-footer-link/);
          assert.match(footer,/value\(data_info\?\.facebook\)/);
          assert.match(footer,/value\(data_info\?\.googlemapHaNoi\)/);
          assert.match(footer,/knowledgeHref/);
          assert.doesNotMatch(footer,/<form\b|Bản preview độc lập|Thông tin và hình ảnh sản phẩm được đối chiếu/);
          assert.match(css,/#footer-contact > \.marine-footer__content/);
          console.log('MARINEAQUA_FOOTER_SOURCE=PASS');
          NODE
      - name: Run Astro unit tests
        run: pnpm run test:run
      # Validate approved Marine Aqua design integration with local Quicksand, CMS-only menu and prices.
      - name: Run Astro code checks
        run: pnpm run check
