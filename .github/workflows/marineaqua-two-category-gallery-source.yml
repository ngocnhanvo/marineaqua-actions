name: Marine Aqua two category original gallery inventory
on:
  workflow_run:
    workflows: ["Marine Aqua two category source inventory"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gallery-source:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.id == 43188424042 && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-two-category-gallery-source.mjs
      - name: Recover source category inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p two-category-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/runs/43188424042/artifacts" -o /tmp/artifacts.json
          python3 - <<'PY'
          import json
          artifacts=json.load(open('/tmp/artifacts.json'))['artifacts']
          selected=[x for x in artifacts if x['name']=='marine-aqua-two-category-inventory' and not x['expired']]
          assert len(selected)==1,'Source artifact not found'
          open('/tmp/id','w').write(str(selected[0]['id']))
          PY
          id="$(cat /tmp/id)"
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/$id/zip" -o /tmp/inventory.zip
          python3 -m zipfile -e /tmp/inventory.zip two-category-catalog-evidence
      - name: Inventory full-resolution source gallery assets
        run: node scripts/marineaqua-two-category-gallery-source.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-two-category-gallery-source
          path: two-category-gallery-source-evidence/
          retention-days: 14
