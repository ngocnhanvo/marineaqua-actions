name: Marine Aqua import verified Sanking galleries
on:
  workflow_run:
    workflows: ["Marine Aqua import verified Sanking catalog"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  gallery:
    if: github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: marine-aqua-woocommerce-brand-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-sanking-gallery-import.mjs
      - name: Recover verified original gallery and product inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for pair in "13940113224 sanking-catalog-evidence" "13939864153 sanking-gallery-source-evidence"; do
            set -- $pair
            mkdir -p "$2"
            curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/$1/zip" -o "/tmp/$1.zip"
            python3 -m zipfile -e "/tmp/$1.zip" "$2"
          done
      - name: Restore original Sanking gallery order and exact images
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-sanking-gallery-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-sanking-gallery-import
          path: sanking-gallery-import-evidence/
          retention-days: 14
