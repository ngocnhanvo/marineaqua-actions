name: Marine Aqua category layout live QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/marineaqua-category-layout-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Restore immutable source inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p next-category-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13946955098/zip" -o /tmp/catalog.zip
          python3 -m zipfile -e /tmp/catalog.zip next-category-catalog-evidence
      - run: node scripts/marineaqua-next-category-postdeploy-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-category-layout-live-qa
          path: next-category-production-qa-evidence/

# Verify independent live card layout and archive membership
