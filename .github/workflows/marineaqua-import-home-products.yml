name: Marine Aqua import verified homepage WooCommerce products
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-import-home-products.mjs'
      - '.github/workflows/marineaqua-import-home-products.yml'
permissions:
  contents: read
concurrency:
  group: marineaqua-import-source-home-products
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-catalog-audit.mjs && node --check scripts/marineaqua-import-home-products.mjs
      - name: Re-audit 20 original products
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-catalog-audit.mjs
      - name: Import only verified WooCommerce products and original media
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-import-home-products.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-original-product-migration
          path: |
            catalog-audit-evidence/
            catalog-import-evidence/
          retention-days: 7
