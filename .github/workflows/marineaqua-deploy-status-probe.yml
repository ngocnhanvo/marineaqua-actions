name: Marine Aqua read-only production deployment status probe
# Read-only verification checkpoint after first informational page production release
# Observe native Header menu link update attempt
# Read-only check the production build requested for five validated Header links
# Validate corrected mobile 390px QA follow-up run
# Reconcile exact sharing Page conflict after migration inventory
# Inspect second sharing migration attempt
# Follow migration after Knowledge Page reuse
# Watch featured media migration after sanitized WordPress search
# Check subsequent migration after preserving Knowledge Page key
# Check native WordPress media migration attempt
# Confirm fast source content import after superseded run cancellation
# Verify sharing Header workflow has started after 133 Post import PASS
# Confirm sharing content production deploy and QA checkpoint
# Observe canonical Astro rebuild after fixing Knowledge archive prerender
# Read status for sharing archive production run triggered by bridge
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-deploy-status-probe.yml'
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Persist read-only canonical production run statuses
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const repo=process.env.GH_REPO;
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const url='https://api.github.com/repos/'+repo+'/actions/workflows/marineaqua-production-deploy.yml/runs?per_page=12';
          const response=await fetch(url,{headers});
          if(!response.ok)throw Error('Read-only runs API failed '+response.status);
          const data=await response.json();
          const runs=(data.workflow_runs||[]).map(x=>({id:x.id,status:x.status,conclusion:x.conclusion,head_sha:x.head_sha,created_at:x.created_at,updated_at:x.updated_at,html_url:x.html_url,event:x.event}));
          const qaUrl='https://api.github.com/repos/'+repo+'/actions/workflows/marineaqua-information-pages-live-qa.yml/runs?per_page=12';
          const qaResponse=await fetch(qaUrl,{headers});
          if(!qaResponse.ok)throw Error('Read-only QA runs API failed '+qaResponse.status);
          const qaData=await qaResponse.json();
          const qaRuns=(qaData.workflow_runs||[]).map(x=>({id:x.id,status:x.status,conclusion:x.conclusion,head_sha:x.head_sha,created_at:x.created_at,updated_at:x.updated_at,html_url:x.html_url,event:x.event}));
          const menuRunResponse=await fetch('https://api.github.com/repos/'+repo+'/actions/workflows/marineaqua-header-information-links.yml/runs?per_page=10',{headers});
          if(!menuRunResponse.ok)throw Error('Header workflow run lookup failed '+menuRunResponse.status);
          const menuData=await menuRunResponse.json();
          const menuRuns=(menuData.workflow_runs||[]).map(x=>({id:x.id,status:x.status,conclusion:x.conclusion,created_at:x.created_at,html_url:x.html_url}));
          const bridgeResponse=await fetch('https://api.github.com/repos/'+repo+'/actions/workflows/marineaqua-dispatch-bridge.yml/runs?per_page=5',{headers});
          if(!bridgeResponse.ok)throw Error('Bridge workflow lookup failed '+bridgeResponse.status);
          const bridgeData=await bridgeResponse.json();
          const bridgeRuns=(bridgeData.workflow_runs||[]).map(x=>({id:x.id,status:x.status,conclusion:x.conclusion,created_at:x.created_at,html_url:x.html_url}));
          const headerQaResponse=await fetch('https://api.github.com/repos/'+repo+'/actions/workflows/marineaqua-header-information-links-live-qa.yml/runs?per_page=6',{headers});
          if(!headerQaResponse.ok)throw Error('Header QA lookup HTTP '+headerQaResponse.status);
          const headerQaData=await headerQaResponse.json();
          const headerQaRuns=(headerQaData.workflow_runs||[]).map(x=>({id:x.id,status:x.status,conclusion:x.conclusion,created_at:x.created_at,html_url:x.html_url}));
          const sharingResponse=await fetch('https://api.github.com/repos/'+repo+'/actions/workflows/marineaqua-sharing-inventory.yml/runs?per_page=5',{headers});
          if(!sharingResponse.ok)throw Error('Sharing audit runs HTTP '+sharingResponse.status);
          const sharingData=await sharingResponse.json();
          const sharingRuns=(sharingData.workflow_runs||[]).map(x=>({id:x.id,status:x.status,conclusion:x.conclusion,created_at:x.created_at,html_url:x.html_url}));
          const sharingMigrationResponse=await fetch('https://api.github.com/repos/'+repo+'/actions/workflows/marineaqua-sharing-migrate.yml/runs?per_page=6',{headers});
          if(!sharingMigrationResponse.ok)throw Error('Sharing migration run lookup HTTP '+sharingMigrationResponse.status);
          const sharingMigrationData=await sharingMigrationResponse.json();
          const sharingMigrationRuns=(sharingMigrationData.workflow_runs||[]).map(x=>({id:x.id,status:x.status,conclusion:x.conclusion,created_at:x.created_at,html_url:x.html_url}));
          const sharingHeaderResponse=await fetch('https://api.github.com/repos/'+repo+'/actions/workflows/marineaqua-sharing-header-release.yml/runs?per_page=6',{headers});
          if(!sharingHeaderResponse.ok)throw Error('Sharing Header runs HTTP '+sharingHeaderResponse.status);
          const sharingHeaderData=await sharingHeaderResponse.json();
          const sharingHeaderRuns=(sharingHeaderData.workflow_runs||[]).map(x=>({id:x.id,status:x.status,conclusion:x.conclusion,created_at:x.created_at,html_url:x.html_url}));
          const sharingQaResponse=await fetch('https://api.github.com/repos/'+repo+'/actions/workflows/marineaqua-sharing-live-qa.yml/runs?per_page=6',{headers});
          if(!sharingQaResponse.ok)throw Error('Sharing QA runs HTTP '+sharingQaResponse.status);
          const sharingQaData=await sharingQaResponse.json();
          const sharingQaRuns=(sharingQaData.workflow_runs||[]).map(x=>({id:x.id,status:x.status,conclusion:x.conclusion,created_at:x.created_at,html_url:x.html_url}));
          const endpoint='https://api.github.com/repos/'+repo+'/contents/docs/information-pages-production-runs.json';
          const previous=await fetch(endpoint,{headers}).then(r=>r.ok?r.json():null);
          const body={message:'Record read-only canonical production run statuses',content:Buffer.from(JSON.stringify({runs,qaRuns,menuRuns,bridgeRuns,headerQaRuns,sharingRuns,sharingMigrationRuns,sharingHeaderRuns,sharingQaRuns},null,2)+String.fromCharCode(10)).toString('base64'),branch:'main'};
          if(previous?.sha)body.sha=previous.sha;
          const saved=await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify(body)});
          if(!saved.ok)throw Error('Status evidence write failed '+saved.status+' '+(await saved.text()).slice(0,140));
          console.log('MARINEAQUA_CANONICAL_DEPLOY_RUNS='+JSON.stringify({runs,qaRuns}));
          NODE
