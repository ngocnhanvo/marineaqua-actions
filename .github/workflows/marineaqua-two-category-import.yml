name: Marine Aqua import two verified product category trees
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-two-category-import.yml'
  workflow_run:
    workflows: ["Marine Aqua two category verified taxonomy mapping"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: marine-aqua-woocommerce-brand-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-two-category-import.mjs
      - name: Fetch immutable original source product and taxonomy mapping evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p two-category-catalog-evidence two-category-mapping-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13929359331/zip" --output /tmp/two-category-source.zip
          python3 -m zipfile -e /tmp/two-category-source.zip two-category-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13931210653/zip" --output /tmp/two-category-map.zip
          python3 -m zipfile -e /tmp/two-category-map.zip two-category-mapping-evidence
          echo "TWO_CATEGORY_IMMUTABLE_ARTIFACTS=13929359331,13931210653"
          test -s two-category-catalog-evidence/manifest.json
          test -s two-category-mapping-evidence/mapping.json
      - name: Import only missing products and attach new categories to existing products
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-two-category-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-two-category-import
          path: two-category-import-evidence/
          retention-days: 14
