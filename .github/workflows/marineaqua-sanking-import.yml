name: Marine Aqua import verified Sanking catalog
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-sanking-import.mjs'
      - '.github/workflows/marineaqua-sanking-import.yml'
permissions:
  contents: read
  actions: read
jobs:
  import:
    concurrency:
      group: marine-aqua-woocommerce-brand-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-sanking-import.mjs
      - name: Recover three independently verified immutable source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for pair in "13940113224 sanking-catalog-evidence" "13940688222 sanking-mapping-evidence" "13940758307 sanking-price-oracle-evidence"; do
            set -- $pair
            id="$1"; dir="$2"
            mkdir -p "$dir"
            curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/$id/zip" -o "/tmp/$id.zip"
            python3 -m zipfile -e "/tmp/$id.zip" "$dir"
          done
          test -s sanking-catalog-evidence/manifest.json
          test -s sanking-mapping-evidence/mapping.json
          test -s sanking-price-oracle-evidence/oracle.json
      - name: Import missing Sanking products and append verified category only
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-sanking-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-sanking-import
          path: sanking-import-evidence/
          retention-days: 14
