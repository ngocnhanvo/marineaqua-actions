name: Marine Aqua original gallery source inventory
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-brand-gallery-source.mjs'
      - '.github/workflows/marineaqua-brand-gallery-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-brand-gallery-source.mjs
      - name: Restore source manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p brand-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13917609900/zip" --output /tmp/brand-products.zip
          python3 -m zipfile -e /tmp/brand-products.zip brand-catalog-evidence
          test -s brand-catalog-evidence/manifest.json
      - run: node scripts/marineaqua-brand-gallery-source.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-brand-gallery-source
          path: brand-gallery-source-evidence/
          retention-days: 14
