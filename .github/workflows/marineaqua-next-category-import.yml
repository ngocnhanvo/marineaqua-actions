name: Marine Aqua next categories idempotent import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-next-category-import.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: marine-aqua-woocommerce-brand-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-next-category-import.mjs
      - name: Restore verified source catalog and three independent gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for pair in "13946955098 next-category-catalog-evidence" "13947510736 next-category-oracles"; do
            set -- $pair
            if [ "$2" = "next-category-oracles" ]; then
              mkdir -p next-category-price-oracle-evidence next-category-mapping-evidence next-category-gallery-source-evidence
              curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/$1/zip" -o /tmp/oracles.zip
              python3 -m zipfile -e /tmp/oracles.zip .
            else
              mkdir -p "$2"
              curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/$1/zip" -o /tmp/catalog.zip
              python3 -m zipfile -e /tmp/catalog.zip "$2"
            fi
          done
      - name: Safely reuse 134 and create only 12 missing source-verified products
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-next-category-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-next-category-import
          path: next-category-import-evidence/
          retention-days: 14
