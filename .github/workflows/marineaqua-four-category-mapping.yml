name: Marine Aqua four categories mapping
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-four-category-mapping.mjs'
      - '.github/workflows/marineaqua-four-category-mapping.yml'
permissions:
  contents: read
  actions: read
jobs:
  mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/marineaqua-four-category-mapping.mjs
      - name: Fetch exact triggering source manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p four-category-catalog-evidence
          id="13942597917"
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/$id/zip" -o /tmp/source.zip
          python3 -m zipfile -e /tmp/source.zip four-category-catalog-evidence
          test -s four-category-catalog-evidence/manifest.json
      - name: Verify four categories mapping
        run: node scripts/marineaqua-four-category-mapping.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-four-category-mapping
          path: four-category-mapping-evidence/
          retention-days: 14
