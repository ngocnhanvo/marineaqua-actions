name: Marine Aqua product category active menu live QA
# Re-run desktop/mobile URL alias checks after the final legacy redirect release.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-product-active-menu-qa.yml'
      - 'scripts/marineaqua-product-active-menu-qa.mjs'
  workflow_run:
    workflows:
      - Marine Aqua Astro deployment (WordPress Build Website only)
    types: [completed]
permissions:
  contents: read
concurrency:
  group: marineaqua-product-active-menu-qa
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ngocnhanvo/marineaqua-actions' && (github.event_name == 'push' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax
        run: node --check scripts/marineaqua-product-active-menu-qa.mjs
      - name: Install matching Playwright driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Check active category in archives and details desktop/mobile
        run: node scripts/marineaqua-product-active-menu-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-active-menu-qa
          path: product-active-menu-evidence/
          retention-days: 14
