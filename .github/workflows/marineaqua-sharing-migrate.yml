name: Marine Aqua migrate 133 sharing posts and seven categories
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-sharing-migrate.mjs'
      - '.github/workflows/marineaqua-sharing-migrate.yml'
permissions:
  contents: write
concurrency:
  group: marineaqua-sharing-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-sharing-migrate.mjs
      - id: migrate-posts
        name: Idempotently import authentic sharing categories, Posts and featured images
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-sharing-migrate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-sharing-migration
          path: sharing-migration-evidence/
          retention-days: 14
      - name: Persist post migration evidence and progress
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          MIGRATION_OUTCOME: ${{ steps.migrate-posts.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          const p='sharing-migration-evidence/result.json';
          const doc=existsSync(p)?JSON.parse(readFileSync(p,'utf8')):{status:'NO_EVIDENCE',errors:['No migration report']};
          const evidence={...doc,run_id:process.env.GH_RUN_ID,outcome:process.env.MIGRATION_OUTCOME};
          const repo=process.env.GH_REPO;
          const endpoint='https://api.github.com/repos/'+repo+'/contents/docs/sharing-migration-latest.json';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const old=await fetch(endpoint,{headers}).then(r=>r.ok?r.json():null);
          const body={message:'Record sharing Post migration run '+evidence.run_id,content:Buffer.from(JSON.stringify(evidence,null,2)+String.fromCharCode(10)).toString('base64'),branch:'main'};
          if(old?.sha)body.sha=old.sha;
          const result=await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify(body)});
          if(!result.ok)throw Error('Persist sharing report HTTP '+result.status);
          console.log('SHARING_MIGRATION_REPORT='+JSON.stringify({run_id:evidence.run_id,status:evidence.status,posts:evidence.posts?.length,errors:evidence.errors?.length}));
          NODE
