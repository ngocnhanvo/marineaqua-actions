name: Marine Aqua two category original gallery parity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-two-category-gallery-parity.yml'
      - 'scripts/marineaqua-two-category-gallery-parity.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-two-category-gallery-parity.mjs
      - name: Restore original full resolution gallery and catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p two-category-catalog-evidence two-category-gallery-source-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13929359331/zip" -o /tmp/source.zip
          python3 -m zipfile -e /tmp/source.zip two-category-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13929634487/zip" -o /tmp/gallery.zip
          python3 -m zipfile -e /tmp/gallery.zip two-category-gallery-source-evidence
      - name: Strict original image identity and gallery order parity for new products
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-two-category-gallery-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-two-category-gallery-parity
          path: two-category-gallery-parity-evidence/
          retention-days: 14
