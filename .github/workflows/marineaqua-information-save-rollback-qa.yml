name: Marine Aqua native WordPress Page Editor Save Rollback QA
# Safety hold: do not auto-run real CMS writes until Page token mapping is fixed.
on:
  workflow_dispatch:
  # Manual-only: this test writes and restores a scoped real WordPress Page.
  # Real CMS writes are manual-only pending reliable source-coordinate Save QA.
permissions:
  contents: read
concurrency:
  group: marineaqua-page-editor-save-rollback
  cancel-in-progress: false
jobs:
  qa:
    if: github.repository == 'ngocnhanvo/marineaqua-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify test syntax before touching WordPress
        run: node --check scripts/marineaqua-information-save-rollback-qa.mjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Save one native Page Editor text token, read back and restore original
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-information-save-rollback-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: information-page-save-rollback
          path: artifacts/information-save-rollback/
          retention-days: 14
