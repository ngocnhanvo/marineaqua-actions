name: Marine Aqua sharing Header selected-page QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-sharing-menu-active-qa.mjs'
      - '.github/workflows/marineaqua-sharing-menu-active-qa.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-sharing-menu-active-qa.mjs
      - id: browser-qa
        run: node scripts/marineaqua-sharing-menu-active-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-sharing-menu-active
          path: sharing-nav-active-evidence/
      - name: Persist QA result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          const p='sharing-nav-active-evidence/result.json';
          const report=existsSync(p)?JSON.parse(readFileSync(p,'utf8')):{status:'NO_EVIDENCE'};
          report.run_id=process.env.GH_RUN_ID;
          const endpoint='https://api.github.com/repos/'+process.env.GH_REPO+'/contents/docs/sharing-menu-active-qa-latest.json';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const content=Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64');
          for(let i=0;i<6;i++){
            const oldResponse=await fetch(endpoint,{headers,cache:'no-store'});
            const old=oldResponse.ok?await oldResponse.json():null;
            if(!oldResponse.ok&&oldResponse.status!==404)throw Error('Evidence read HTTP '+oldResponse.status);
            const body={message:'Record current sharing menu QA '+report.run_id,content,branch:'main'};
            if(old?.sha)body.sha=old.sha;
            const resp=await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify(body)});
            if(resp.ok)process.exit(0);
            if(![409,422].includes(resp.status))throw Error('Evidence write HTTP '+resp.status);
            await new Promise(r=>setTimeout(r,(i+1)*700));
          }
          throw Error('Could not save menu QA report');
          NODE
