name: Marine Aqua unified sharing search and sort QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-sharing-unified-toolbar-qa.mjs'
      - '.github/workflows/marineaqua-sharing-unified-toolbar-qa.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-sharing-unified-toolbar-qa.mjs
      - id: qa
        run: node scripts/marineaqua-sharing-unified-toolbar-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-sharing-unified-toolbar
          path: sharing-unified-toolbar-evidence/
      - name: Save QA checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          const path='sharing-unified-toolbar-evidence/result.json';
          const doc=existsSync(path)?JSON.parse(readFileSync(path,'utf8')):{status:'NO_EVIDENCE'};
          doc.run_id=process.env.GH_RUN_ID;
          const url='https://api.github.com/repos/'+process.env.GH_REPO+'/contents/docs/sharing-unified-toolbar-qa-latest.json';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          for(let i=0;i<5;i++){
            const oldResponse=await fetch(url,{headers,cache:'no-store'});
            const old=oldResponse.ok?await oldResponse.json():null;
            const body={message:'Record unified toolbar QA '+doc.run_id,content:Buffer.from(JSON.stringify(doc,null,2)+'\n').toString('base64'),branch:'main'};
            if(old?.sha)body.sha=old.sha;
            const r=await fetch(url,{method:'PUT',headers,body:JSON.stringify(body)});
            if(r.ok)process.exit(0);
            if(r.status!==409&&r.status!==422)throw Error('Save evidence HTTP '+r.status);
            await new Promise(resolve=>setTimeout((i+1)*700));
          }
          throw Error('Failed persisting QA evidence after retry');
          NODE
