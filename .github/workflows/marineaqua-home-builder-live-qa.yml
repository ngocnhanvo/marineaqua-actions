name: Marine Aqua homepage builder live QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-home-builder-live-qa.yml'
      - 'scripts/marineaqua-home-builder-live-qa.mjs'
permissions:
  contents: write
  actions: read
concurrency:
  group: marineaqua-home-builder-live-qa
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'ngocnhanvo/marineaqua-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 23
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/marineaqua-home-builder-live-qa.mjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify production SHA, homepage fields and native builder field selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-home-builder-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-home-builder-live
          path: home-builder-live-evidence/
          retention-days: 14
      - name: Preserve QA result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const path='qa-results/20261114-home-builder-live.json';
            const src='home-builder-live-evidence/result.json';
            const result=fs.existsSync(src)?JSON.parse(fs.readFileSync(src,'utf8')):{status:'FAIL',errors:['No QA report']};
            result.qa_run_id=context.runId;
            result.qa_url=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            result.recorded_at=new Date().toISOString();
            const owner=context.repo.owner,repo=context.repo.repo;
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:'main'})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',sha,
              message:'Lưu QA Visual Builder trang chủ',
              content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64')});
