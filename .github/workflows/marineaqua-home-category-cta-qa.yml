name: Marine Aqua home category CTA live QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-home-category-cta-qa.yml'
      - 'scripts/marineaqua-home-category-cta-qa.mjs'
permissions:
  contents: read
concurrency:
  group: marineaqua-home-category-cta-qa
  cancel-in-progress: false
jobs:
  browser:
    if: github.repository == 'ngocnhanvo/marineaqua-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/marineaqua-home-category-cta-qa.mjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify homepage CTA navigates to product listing on desktop and mobile
        run: node scripts/marineaqua-home-category-cta-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-category-cta-evidence
          path: home-category-cta-evidence/
          retention-days: 14
