name: Marine Aqua brand catalog inventory
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-brand-catalog-inventory.mjs'
      - '.github/workflows/marineaqua-brand-catalog-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-brand-catalog-inventory.mjs
      - name: Inventory original brand category and target taxonomy
        run: node scripts/marineaqua-brand-catalog-inventory.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-brand-catalog-inventory
          path: brand-catalog-evidence/
          retention-days: 7
