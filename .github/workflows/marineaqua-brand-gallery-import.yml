name: Marine Aqua restore full verified galleries
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-brand-gallery-import.mjs'
      - '.github/workflows/marineaqua-brand-gallery-import.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: marine-aqua-woocommerce-brand-import
  cancel-in-progress: false
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-brand-gallery-import.mjs
      - name: Restore immutable original gallery and catalog manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p brand-catalog-evidence brand-gallery-source-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13917609900/zip" --output /tmp/brand-products.zip
          python3 -m zipfile -e /tmp/brand-products.zip brand-catalog-evidence
          test -s brand-catalog-evidence/manifest.json
          GALLERY_ARTIFACT_ID=13920814186
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/$GALLERY_ARTIFACT_ID/zip" --output /tmp/brand-galleries.zip
          python3 -m zipfile -e /tmp/brand-galleries.zip brand-gallery-source-evidence
          test -s brand-gallery-source-evidence/manifest.json
      - name: Restore complete owned product media and verify gallery readback
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-brand-gallery-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-brand-gallery-import
          path: brand-gallery-import-evidence/
          retention-days: 14
