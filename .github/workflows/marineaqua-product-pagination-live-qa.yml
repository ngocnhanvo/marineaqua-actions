name: Marine Aqua product pagination production live QA (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-product-pagination-live-qa.yml'
      - 'scripts/marineaqua-product-pagination-live-qa.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marineaqua-product-pagination-readonly-qa
  cancel-in-progress: false
jobs:
  qa:
    if: github.repository == 'ngocnhanvo/marineaqua-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check QA syntax
        run: node --check scripts/marineaqua-product-pagination-live-qa.mjs
      - name: Install Playwright driver for preinstalled Chromium
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Validate WordPress paged + legacy API and live desktop/mobile homepage
        run: node scripts/marineaqua-product-pagination-live-qa.mjs
      - name: Save read-only live QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marineaqua-product-pagination-live-qa
          path: marineaqua-pagination-live-qa/
          retention-days: 14
