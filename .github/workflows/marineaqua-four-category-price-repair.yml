name: Marine Aqua four categories oracle price repair
on:
  workflow_run:
    workflows: ["Marine Aqua four categories append verified product terms"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: marine-aqua-woocommerce-brand-import
  cancel-in-progress: false
jobs:
  repair:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-four-category-price-repair.mjs
      - name: Restore independently captured source price and mapping
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for pair in "13942597917 four-category-catalog-evidence" "13944050499 four-category-mapping-evidence" "13942662942 four-category-price-oracle-evidence"; do
            set -- $pair
            mkdir -p "$2"
            curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/$1/zip" -o "/tmp/$1.zip"
            python3 -m zipfile -e "/tmp/$1.zip" "$2"
          done
      - name: Repair only source-verified mismatched price and stock fields
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-four-category-price-repair.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-four-category-price-repair
          path: four-category-price-repair-evidence/
          retention-days: 14
