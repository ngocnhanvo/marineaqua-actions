name: Marine Aqua Home Visual Builder read-only audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-home-builder-audit.yml'
      - 'scripts/marineaqua-home-builder-audit.mjs'
permissions:
  contents: write
concurrency:
  group: marineaqua-home-builder-readonly-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'ngocnhanvo/marineaqua-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/marineaqua-home-builder-audit.mjs
      - name: Inspect homepage ESC tables and WordPress visual editor without writes
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
          node scripts/marineaqua-home-builder-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-home-builder-audit
          path: home-builder-audit-evidence/
          retention-days: 14
      - name: Persist audit evidence for next checkpoint
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const path='qa-results/20261114-home-builder-audit.json';
            const evidence='home-builder-audit-evidence/result.json';
            const result=fs.existsSync(evidence)?JSON.parse(fs.readFileSync(evidence,'utf8')):{status:'FAIL',issues:['Audit did not produce result.json']};
            result.run_id=context.runId;
            result.run_url=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            result.completed_at=new Date().toISOString();
            const owner=context.repo.owner,repo=context.repo.repo;
            let sha;
            try{const current=await github.rest.repos.getContent({owner,repo,path,ref:'main'});sha=current.data.sha;}
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',sha,
              message:'Lưu kết quả kiểm kê Visual Builder trang chủ',
              content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64')});
