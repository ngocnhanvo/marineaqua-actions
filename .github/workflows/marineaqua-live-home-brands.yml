name: Marine Aqua live homepage brand sections QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-live-home-brands.mjs'
      - 'scripts/marineaqua-footer-readonly.mjs'
      - '.github/workflows/marineaqua-live-home-brands.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-brand-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-live-home-brands.mjs
      - name: Read-only browser test of production homepage and product pages
        run: node scripts/marineaqua-live-home-brands.mjs
      - name: Inspect WordPress footer links and live routes (read only)
        run: node scripts/marineaqua-footer-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-live-home-brands-visual-qa
          path: |
            home-products-live-evidence/
            footer-live-evidence/
          retention-days: 7
