name: Marine Aqua brand taxonomy mapping
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-brand-taxonomy-mapping.mjs'
      - '.github/workflows/marineaqua-brand-taxonomy-mapping.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  brand-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-brand-taxonomy-mapping.mjs
      - name: Download verified original product manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p brand-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13917609900/zip" --output /tmp/brand-manifest.zip
          python3 -m zipfile -e /tmp/brand-manifest.zip brand-catalog-evidence
          test -s brand-catalog-evidence/manifest.json
      - name: Map verified product URLs to source brand categories
        run: node scripts/marineaqua-brand-taxonomy-mapping.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-brand-category-mapping
          path: brand-taxonomy-mapping-evidence/
          retention-days: 7
