name: Marine Aqua next categories independent source verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-next-category-oracles.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Restore immutable catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p next-category-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13946955098/zip" -o /tmp/catalog.zip
          python3 -m zipfile -e /tmp/catalog.zip next-category-catalog-evidence
      - name: Verify independent original archive price and stock
        run: node scripts/marineaqua-next-category-price-oracle.mjs
      - name: Verify original fullsize galleries
        run: node scripts/marineaqua-next-category-gallery-source.mjs
      - name: Verify exact taxonomy mappings
        run: node scripts/marineaqua-next-category-mapping.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-next-category-oracles
          path: |
            next-category-price-oracle-evidence/
            next-category-gallery-source-evidence/
            next-category-mapping-evidence/
          retention-days: 14
