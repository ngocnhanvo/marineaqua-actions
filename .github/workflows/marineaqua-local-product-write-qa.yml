name: Marine Aqua local Product REST write and restore QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-local-product-write-qa.yml'
      - 'scripts/marineaqua-local-product-write-qa.mjs'
permissions:
  contents: read
concurrency:
  group: marineaqua-local-product-write-qa
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ngocnhanvo/marineaqua-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/marineaqua-local-product-write-qa.mjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify authorized Product reference add swap delete REST and rollback
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-local-product-write-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-local-product-write-qa
          path: artifacts/local-product-write-qa/
          retention-days: 14
