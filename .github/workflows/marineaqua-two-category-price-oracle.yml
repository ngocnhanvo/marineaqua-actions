name: Marine Aqua original two category price and stock oracle
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-two-category-price-oracle.mjs'
      - '.github/workflows/marineaqua-two-category-price-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-two-category-price-oracle.mjs
      - name: Restore verified independent source archive URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p two-category-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13929359331/zip" -o /tmp/source.zip
          python3 -m zipfile -e /tmp/source.zip two-category-catalog-evidence
      - name: Audit independently all source product card prices and stock
        run: node scripts/marineaqua-two-category-price-oracle.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-two-category-price-oracle
          path: two-category-price-oracle-evidence/
          retention-days: 14
