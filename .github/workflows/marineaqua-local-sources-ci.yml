name: Marine Aqua local Page and ProductCategory immutable-reference contracts (NO DEPLOY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-local-sources-ci.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    if: github.repository == 'ngocnhanvo/marineaqua-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/marineaqua-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Check local source unit harness syntax
        run: php -l source-php/tests/visual-builder-local-sources.test.php
      - name: Validate semantic technical keys are never editable
        run: php source-php/wp-content/plugins/esc-visual-builder/tests/site-config.dynamic.test.php
      - name: Exercise existing generic item and section contract
        run: php source-php/wp-content/plugins/esc-visual-builder/tests/items-and-sections.test.php
      - name: Validate actual source implementation against Page and ProductCategory mocks
        run: php source-php/tests/visual-builder-local-sources.test.php
