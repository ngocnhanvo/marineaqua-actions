name: Marine Aqua Astro source checks Product Builder (NO DEPLOY)
# Recheck live product-category route and red price listing changes on Astro master.
# Regression checks now include redirect-alias and nested brand route Vitest cases.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-astro-ci.yml'
      - 'scripts/marineaqua-import-home-products.mjs'
      - 'scripts/marineaqua-bind-home-products.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marineaqua-astro-source-checks
  cancel-in-progress: false
jobs:
  astro-checks:
    if: github.repository == 'ngocnhanvo/marineaqua-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify source access token is configured
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: test -n "$SOURCE_REPO_PAT" || { echo "::error::Missing SOURCE_REPO_PAT"; exit 1; }
      - name: Checkout Astro source from owner-required master branch
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/marineaqua-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - name: Record and verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = master
          test -f package.json
          test -f pnpm-lock.yaml
          echo "MARINEAQUA_ASTRO_TEST_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Astro source: $(git rev-parse HEAD) (master)" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact locked dependencies (no production build)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify home product category URLs and stock source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const component=readFileSync('src/astro/components/Home/BrandProductSection.astro','utf8');
          const mapper=readFileSync('src/lib/wordpress/products/getData.ts','utf8');
          assert.match(component,/const moreHref = listingSlug && categorySlug/);
          assert.match(component,/availability === "outofstock"/);
          assert.match(mapper,/item\.class_list\.includes\("outofstock"\)/);
          assert.match(mapper,/stockStatus: initI18n\(stockStatus\)/);
          console.log('HOME_PRODUCT_LINK_AND_STOCK_SOURCE=PASS');
          NODE
      - name: Verify WordPress-owned marine footer source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const footer=readFileSync('src/astro/components/Layout/Footer.astro','utf8');
          const css=readFileSync('src/styles/marine-aqua-approved.css','utf8');
          assert.match(footer,/data-marine-footer-link/);
          assert.match(footer,/value\(data_info\?\.facebook\)/);
          assert.match(footer,/value\(data_info\?\.googlemapHaNoi\)/);
          assert.match(footer,/knowledgeHref/);
          assert.doesNotMatch(footer,/<form\b|Bản preview độc lập|Thông tin và hình ảnh sản phẩm được đối chiếu/);
          assert.match(css,/#footer-contact > \.marine-footer__content/);
          console.log('MARINEAQUA_FOOTER_SOURCE=PASS');
          NODE
      - name: Verify cart mutations and read-only checkout preparation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = (name) => readFileSync(name, 'utf8');
          const cart = read('src/pages/api/cart/index.ts');
          const update = read('src/pages/api/cart/update.ts');
          const del = read('src/pages/api/cart/del.ts');
          assert.match(cart, /export const GET/);
          assert.match(cart, /method: 'POST'/); // explicit coupon write helper only
          const getHandler = cart.slice(cart.indexOf('export const GET'));
          assert.doesNotMatch(getHandler, /sync_coupons|method: 'POST'|namespace: 'sync-coupons-db'/);
          assert.match(getHandler, /Cart-Key/);
          assert.match(update, /if \(!response\.ok\)/);
          assert.match(update, /Number\.isSafeInteger/);
          assert.match(del, /if \(!response\.ok\)/);
          assert.match(del, /if \(!cartResponse\.ok\)/);
          assert.match(update, /encodeURIComponent\(item_key\)/);
          assert.match(del, /encodeURIComponent\(item_key\)/);
          console.log('CART_READ_ONLY_AND_MUTATION_STATUS=PASS');
          NODE
      - name: Verify WordPress Page intro is rendered without stripping its editable coordinates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const page=readFileSync('src/astro/pages/PostsPage.astro','utf8');
          assert.match(page, /ExtractHTML page=\{page\} props=\{archiveRouterProps\}/);
          assert.match(page, /const archiveIntro = String\(page\?\.content/);
          assert.doesNotMatch(page, /archiveSummary|archiveDescription/);
          console.log('POSTS_WORDPRESS_EDITOR_INTRO=PASS');
          NODE
      - name: Verify Contact Page semantics are WordPress ESC Table-owned
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const contact=readFileSync('src/astro/pages/ContactPage.astro','utf8');
          const label=readFileSync('src/astro/components/SemanticEscLabel.astro','utf8');
          assert.match(contact,/CONTACT_SEMANTIC_ESC_TABLE_MISSING/);
          assert.match(contact,/data-tablepress-preview=\{semanticTableId\}/);
          assert.match(contact,/SemanticEscLabel item=\{meaning\("hero_title"\)\}/);
          assert.match(contact,/SemanticEscLabel item=\{meaning\("dealer_email_label"\)\}/);
          assert.match(label,/data-esc-builder-cell-row=\{item.sourceRow\}/);
          assert.match(label,/data-esc-builder-cell-field="label"/);
          assert.doesNotMatch(contact,/const heading = en \?|Liên hệ mua hàng đại lý và tuyển dụng|const description = en/);
          console.log('CONTACT_WORDPRESS_ESC_SEMANTICS=PASS');
          NODE
      - name: Run Astro unit tests including Product ESC Table reference mapping
        run: pnpm run test:run
      # Validate approved Marine Aqua design integration with local Quicksand, CMS-only menu and prices.
      - name: Run Astro code checks
        run: pnpm run check
