name: Marine Aqua two category restore original galleries
on:
  workflow_run:
    workflows: ["Marine Aqua import two verified product category trees"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gallery:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: marine-aqua-woocommerce-brand-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-two-category-gallery-import.mjs
      - name: Recover verified original gallery and catalog snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p two-category-catalog-evidence two-category-gallery-source-evidence
          python3 - <<'PY'
          import json,os,urllib.request,io,zipfile
          repo='ngocnhanvo/marineaqua-actions';token=os.environ['GH_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}
          def get(url):return json.load(urllib.request.urlopen(urllib.request.Request(url,headers=headers)))
          runs=[(43188424042,'marine-aqua-two-category-inventory','two-category-catalog-evidence')]
          latest=get(f'https://api.github.com/repos/{repo}/actions/workflows/marineaqua-two-category-gallery-source.yml/runs?per_page=20')['workflow_runs']
          passed=[r for r in latest if r.get('conclusion')=='success']
          assert passed,'No verified original gallery source run'
          runs.append((passed[0]['id'],'marine-aqua-two-category-gallery-source','two-category-gallery-source-evidence'))
          for rid,name,dest in runs:
              artifacts=get(f'https://api.github.com/repos/{repo}/actions/runs/{rid}/artifacts')['artifacts']
              found=[a for a in artifacts if a['name']==name and not a['expired']]
              assert len(found)==1,'Missing '+name
              request=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts/{found[0]["id"]}/zip',headers=headers)
              with zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(request).read())) as z:z.extractall(dest)
              print('TWO_CATEGORY_GALLERY_SOURCE_LOCK='+name+' artifact='+str(found[0]['id']))
          PY
          test -s two-category-catalog-evidence/manifest.json
          test -s two-category-gallery-source-evidence/manifest.json
      - name: Import only missing source gallery assets and verify WooCommerce readback
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-two-category-gallery-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-two-category-gallery-import
          path: two-category-gallery-import-evidence/
          retention-days: 14
