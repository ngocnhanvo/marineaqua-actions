name: Marine Aqua Sanking independent price oracle
on:
  workflow_run:
    workflows: ["Marine Aqua Sanking source inventory"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  mapping:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-sanking-price-oracle.mjs
      - name: Fetch exact triggering source manifest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -eu
          mkdir -p sanking-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/runs/$SOURCE_RUN_ID/artifacts" -o /tmp/artifacts.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/artifacts.json'))
          a=[x for x in data.get('artifacts',[]) if x['name']=='marine-aqua-sanking-inventory' and not x.get('expired')]
          assert len(a)==1, 'Expected exactly one original Sanking inventory artifact'
          open('/tmp/artifact-id','w').write(str(a[0]['id']))
          PY
          id="$(cat /tmp/artifact-id)"
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/$id/zip" -o /tmp/source.zip
          python3 -m zipfile -e /tmp/source.zip sanking-catalog-evidence
          test -s sanking-catalog-evidence/manifest.json
      - name: Audit Sanking source archive card prices and stock
        run: node scripts/marineaqua-sanking-price-oracle.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-sanking-price-oracle
          path: sanking-price-oracle-evidence/
          retention-days: 14
