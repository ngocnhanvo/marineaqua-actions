name: Marine Aqua promotion category desktop mobile live QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-promotion-category-live-qa.mjs'
      - '.github/workflows/marineaqua-promotion-category-live-qa.yml'
permissions:
  contents: read
concurrency:
  group: marineaqua-promotion-category-live-qa
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-promotion-category-live-qa.mjs
      - name: Check eight promotion products and excluded category in both menus
        run: node scripts/marineaqua-promotion-category-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-promotion-category-desktop-mobile
          path: promotion-category-live-evidence/
          retention-days: 7
