name: Marine Aqua sharing taxonomy and posts inventory
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-sharing-inventory.mjs'
      - '.github/workflows/marineaqua-sharing-inventory.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-sharing-inventory.mjs
      - run: node scripts/marineaqua-sharing-inventory.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-sharing-inventory
          path: sharing-audit-evidence/
      - name: Persist inventory read-only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const file='sharing-audit-evidence/result.json';
          const report=existsSync(file)?JSON.parse(readFileSync(file,'utf8')):{status:'NO_EVIDENCE'};
          report.run_id=process.env.GH_RUN_ID;
          const endpoint='https://api.github.com/repos/'+process.env.GH_REPO+'/contents/docs/sharing-inventory-latest.json';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const previous=await fetch(endpoint,{headers}).then(r=>r.ok?r.json():null);
          const body={message:'Record Marine Aqua sharing inventory '+report.run_id,content:Buffer.from(JSON.stringify(report,null,2)+String.fromCharCode(10)).toString('base64'),branch:'main'};
          if(previous?.sha)body.sha=previous.sha;
          const response=await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify(body)});
          if(!response.ok)throw Error('Evidence persistence HTTP '+response.status);
          NODE
