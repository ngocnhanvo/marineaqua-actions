name: Marine Aqua verify five Header information links on production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-header-information-links-live-qa.yml'
      - 'scripts/marineaqua-header-information-links-live-qa.mjs'
permissions:
  contents: write
concurrency:
  group: marineaqua-header-information-links-live-qa
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-header-information-links-live-qa.mjs
      - id: browser-qa
        run: node scripts/marineaqua-header-information-links-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-header-information-links-live-qa
          path: header-information-links-live-evidence/
          retention-days: 10
      - name: Persist verified live QA result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          QA_OUTCOME: ${{ steps.browser-qa.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const file='header-information-links-live-evidence/result.json';
          const evidence=existsSync(file)?JSON.parse(readFileSync(file,'utf8')):{status:'NO_EVIDENCE',errors:['No QA result']};
          const payload={...evidence,run_id:process.env.GH_RUN_ID,outcome:process.env.QA_OUTCOME};
          const endpoint='https://api.github.com/repos/'+process.env.GH_REPO+'/contents/docs/header-information-links-live-qa-latest.json';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const old=await fetch(endpoint,{headers}).then(r=>r.ok?r.json():null);
          const body={message:'Record Header information links live QA '+process.env.GH_RUN_ID,content:Buffer.from(JSON.stringify(payload,null,2)+String.fromCharCode(10)).toString('base64'),branch:'main'};
          if(old?.sha)body.sha=old.sha;
          const r=await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify(body)});
          if(!r.ok)throw Error('QA evidence write HTTP '+r.status);
          console.log('HEADER_INFORMATION_LINKS_LIVE_QA_EVIDENCE='+JSON.stringify({run_id:payload.run_id,status:payload.status}));
          NODE
