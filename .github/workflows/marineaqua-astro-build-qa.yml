name: Marine Aqua Astro build validation (NO DEPLOY)
# CMS ESC Table homepage integration QA 2026-11-11: seven native sections; no production deploy.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-astro-build-qa.yml'
permissions:
  contents: read
concurrency:
  group: marineaqua-astro-build-validation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - name: Verify environment is configured
        run: |
          test -n "$ENV_FILE" || { echo "::error::Missing ENV_FILE"; exit 1; }
      - name: Checkout production Astro master only
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/marineaqua-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      # Verify approved design on Astro master without deploying to hosting.
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = master
          echo "Astro QA build source: $(git rev-parse HEAD) (master)" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify WooCommerce category navigation integration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = (path) => readFileSync(path, 'utf8');
          const header = read('src/astro/components/Layout/Header.astro');
          const layout = read('src/astro/components/Layout/Layout.astro');
          const home = read('src/astro/tablepress/Home_00.astro');
          const sidebar = read('src/astro/components/Product/ProductCategorySidebar.astro');
          const branch = read('src/astro/components/Product/ProductCategorySidebarBranch.astro');
          const pagesLoader = read('src/lib/wordpress/pages/index.ts');
          const desktopNav = read('src/astro/components/Menu/Desktop.astro');
          const style = read('src/styles/marine-aqua-approved.css');
          assert.match(header, /data-header-catalog-trigger/);
          assert.match(header, /header-product-catalog-panel/);
          assert.match(header, /header-nav-floating/);
          assert.match(header, /mobile-header-fixed/);
          assert.match(header, /min-width: 1440px/);
          assert.doesNotMatch(header, /id="header-hotline"/);
          assert.ok(style.includes('gap:clamp(8px,1vw,18px);justify-content:flex-start;'));
          assert.match(style, /Clean Ocean header/);
          assert.ok(style.includes('#header-navrow.header-nav-floating'));
          assert.match(desktopNav, /data-marine-active/);
          assert.match(header, /aria-expanded/);
          assert.match(header, /ProductCategorySidebar/);
          assert.match(layout, /productCategories=\{productCategories\}/);
          assert.match(home, /data-home-slider/);
          assert.ok(home.includes('data-marine-home-variant={variant.key}'));
          assert.doesNotMatch(home, /marine-home-banner-with-catalog|marine-home-catalog|ProductCategorySidebar|showHomeCategories/);
          assert.match(header, /data-header-catalog-trigger/);
          assert.match(header, /header-product-catalog-panel/);
          assert.match(header, /maxHeight/);
          assert.match(header, /instanceId="header"/);
          assert.match(sidebar, /data-marine-category-trigger/);
          assert.match(sidebar, /data-marine-category-panel/);
          assert.doesNotMatch(sidebar, /<h2>\\{node.name\\}<\\/h2>/);
          assert.match(header, /border:0;border-radius:0 0 11px 11px/);
          assert.match(sidebar, /instanceId/);
          assert.match(header, /instanceId="header"/);
          assert.match(sidebar, /productCategories/);
          assert.match(sidebar, /rootPath/);
          assert.match(branch, /Astro\.self/);
          assert.match(pagesLoader, /Published Page ID Audit/);
          assert.match(pagesLoader, /New Published Pages Audit/);
          assert.match(pagesLoader, /deletedIds/);
          assert.doesNotMatch(sidebar, /thuancomputer\.com|menu\.json/);
          console.log('CATEGORY_NAV_SOURCE_CONTRACT=PASS');
          NODE
      - name: Build from real WordPress data without deploying
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$ENV_FILE" > .env
          chmod 600 .env
          pnpm run build-git
          test -s dist/client/index.html
          test -s dist/server/entry.mjs
          node --check dist/server/entry.mjs
          test -s dist/client/sitemap.xml
          test -s dist/client/robots.txt
          test -s dist/client/llms.txt
          echo 'ASTRO_PRODUCTION_EQUIVALENT_BUILD=PASS (NO FTP, NO DEPLOY)' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify compiled Header comes only from WordPress (empty allowed)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          values = [line.strip().split('=', 1)[1].strip().strip("\\\"'") for line in os.environ['ENV_FILE'].splitlines() if line.strip().startswith('WC_URL=')]
          if len(values) != 1 or urlsplit(values[0]).hostname != 'admin.marine-aqua.io.vn':
              raise SystemExit('CMS_HEADER_MENU=FAIL invalid WordPress origin')
          with urlopen(Request('https://admin.marine-aqua.io.vn/wp-json/esc-api/v1/menus',
                               headers={'Accept':'application/json'}), timeout=20) as response:
              payload = json.loads(response.read(1000001))
          if not isinstance(payload, dict):
              raise SystemExit('CMS_HEADER_MENU=FAIL invalid WordPress menus response')
          # Mirror normalizeMenuResponse(): absent/unconfigured menu has no navigable items.
          wordpress_menus = payload.get('menus') if payload.get('success') is True and isinstance(payload.get('menus'), dict) else {}
          header = wordpress_menus.get('Header') or {}
          if not isinstance(header, dict):
              raise SystemExit('CMS_HEADER_MENU=FAIL malformed Header data')
          cache = Path('dist/client/data/cms-common.json')
          if not cache.is_file():
              raise SystemExit('CMS_HEADER_MENU=FAIL missing compiled CMS data')
          published = json.loads(cache.read_text())
          locales = {str(p.get('lang')) for p in published.get('pages', []) if isinstance(p, dict) and p.get('lang')}
          if not locales:
              raise SystemExit('CMS_HEADER_MENU=FAIL no published page locales')
          built = published.get('menus', [])
          if not isinstance(built, list):
              raise SystemExit('CMS_HEADER_MENU=FAIL compiled menu is not a list')
          if any(str(item.get('lang')) not in locales for item in built if isinstance(item, dict)):
              raise SystemExit('CMS_HEADER_MENU=FAIL unexpected locale in compiled menu')
          for lang in sorted(locales):
              dto = header.get(lang)
              expected = dto.get('items') if isinstance(dto, dict) else []
              if not isinstance(expected, list):
                  expected = []
              actual = [item for item in built if isinstance(item, dict) and item.get('lang') == lang]
              if len(actual) != len(expected):
                  raise SystemExit('CMS_HEADER_MENU=FAIL compiled count mismatch for locale=' + lang)
              if not expected:
                  print('CMS_HEADER_MENU=EMPTY locale=' + lang + ' source=wordpress')
              else:
                  print('CMS_HEADER_MENU=POPULATED locale=' + lang + ' count=' + str(len(actual)))
          print('CMS_HEADER_MENU=PASS wordpress_only_empty_allowed')
          PY
      - name: Erase ephemeral environment file
        if: always()
        shell: bash
        run: rm -f .env
