name: Marine Aqua original brand product type audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-brand-source-product-types.mjs'
      - '.github/workflows/marineaqua-brand-source-product-types.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  product-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-brand-source-product-types.mjs
      - name: Recover source listing manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p brand-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13917609900/zip" --output /tmp/source-products.zip
          python3 -m zipfile -e /tmp/source-products.zip brand-catalog-evidence
      - name: Audit actual product types
        run: node scripts/marineaqua-brand-source-product-types.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-brand-source-types
          path: brand-source-product-types-evidence/
