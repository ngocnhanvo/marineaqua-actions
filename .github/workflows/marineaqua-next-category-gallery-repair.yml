name: Marine Aqua next categories gallery repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/marineaqua-next-category-gallery-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: marine-aqua-woocommerce-brand-import
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Restore source and gallery evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p next-category-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13946955098/zip" -o /tmp/catalog.zip
          python3 -m zipfile -e /tmp/catalog.zip next-category-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13947510736/zip" -o /tmp/oracles.zip
          python3 -m zipfile -e /tmp/oracles.zip .
      - name: Repair only source gallery mismatches with verified original image bytes
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-next-category-gallery-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-next-category-gallery-repair
          path: next-category-gallery-import-evidence/
          retention-days: 14
