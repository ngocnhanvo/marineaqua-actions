name: Marine Aqua information Pages Visual Builder QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-information-builder-qa.yml'
      - 'scripts/marineaqua-information-builder-qa.mjs'
permissions:
  contents: read
jobs:
  qa:
    if: github.repository == 'ngocnhanvo/marineaqua-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/marineaqua-information-builder-qa.mjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify five native Page editors without WordPress writes
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-information-builder-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: information-builder-qa
          path: artifacts/information-builder-qa/
          retention-days: 14
