name: Marine Aqua repair verified two category price and stock
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-two-category-price-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repair:
    concurrency:
      group: marine-aqua-woocommerce-brand-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-two-category-price-repair.mjs
      - name: Confirm prior original product and gallery import PASS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for run in 43190333150 43192517112 43193282489; do
            curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/runs/$run" -o "/tmp/run-$run.json"
          done
          python3 - <<'PY'
          import json
          for r in (43190333150,43192517112,43193282489):
              obj=json.load(open(f'/tmp/run-{r}.json'))
              assert obj['status']=='completed' and obj['conclusion']=='success',r
          print('TWO_CATEGORY_PRICE_REPAIR_PREFLIGHT=PASS')
          PY
      - name: Restore immutable original archive card price oracle and scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p two-category-catalog-evidence two-category-mapping-evidence two-category-price-oracle-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13929359331/zip" -o /tmp/source.zip
          python3 -m zipfile -e /tmp/source.zip two-category-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13931210653/zip" -o /tmp/mapping.zip
          python3 -m zipfile -e /tmp/mapping.zip two-category-mapping-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13932255797/zip" -o /tmp/price-oracle.zip
          python3 -m zipfile -e /tmp/price-oracle.zip two-category-price-oracle-evidence
      - name: Repair only source-verified differences with rollback snapshots and readback
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-two-category-price-repair.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-two-category-price-repair
          path: two-category-price-repair-evidence/
          retention-days: 14
