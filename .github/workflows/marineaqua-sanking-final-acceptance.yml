name: Marine Aqua Sanking live postdeploy acceptance (NO DEPLOY)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-sanking-postdeploy-qa.mjs'
      - '.github/workflows/marineaqua-sanking-final-acceptance.yml'
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-sanking-postdeploy-qa.mjs
      - name: Restore independently verified source and mapping
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for pair in "13940113224 sanking-catalog-evidence" "13940688222 sanking-mapping-evidence"; do
            set -- $pair
            mkdir -p "$2"
            curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/$1/zip" -o "/tmp/$1.zip"
            python3 -m zipfile -e "/tmp/$1.zip" "$2"
          done
      - name: Verify live Sanking product listing and regression on desktop/mobile
        run: node scripts/marineaqua-sanking-postdeploy-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-sanking-final-acceptance
          path: sanking-production-qa-evidence/
          retention-days: 14
