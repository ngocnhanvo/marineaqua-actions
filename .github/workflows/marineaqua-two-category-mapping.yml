name: Marine Aqua two category verified taxonomy mapping
on:
  workflow_run:
    workflows: ["Marine Aqua two category source inventory"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mapping:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.id == 43188424042 && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/marineaqua-two-category-mapping.mjs
      - name: Recover inventory artifact after successful source crawl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p two-category-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/runs/43188424042/artifacts" -o /tmp/artifacts.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/artifacts.json'))
          candidates=[a for a in data.get('artifacts',[]) if a['name']=='marine-aqua-two-category-inventory' and not a.get('expired')]
          assert len(candidates)==1, 'Expected one original two category manifest'
          open('/tmp/manifest-id','w').write(str(candidates[0]['id']))
          PY
          id="$(cat /tmp/manifest-id)"
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/$id/zip" -o /tmp/manifest.zip
          python3 -m zipfile -e /tmp/manifest.zip two-category-catalog-evidence
          test -s two-category-catalog-evidence/manifest.json
      - name: Strict category and product source-to-target mapping
        run: node scripts/marineaqua-two-category-mapping.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-two-category-mapping
          path: two-category-mapping-evidence/
          retention-days: 14
