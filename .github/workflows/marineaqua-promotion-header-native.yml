name: Marine Aqua bind promotion Header navigation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-promotion-header-native.mjs'
      - '.github/workflows/marineaqua-promotion-header-native.yml'
permissions:
  contents: read
concurrency:
  group: marineaqua-promotion-header-native
  cancel-in-progress: false
jobs:
  bind-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-promotion-header-native.mjs
      - name: Update only live WordPress Header promotion destination
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-promotion-header-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-promotion-header-evidence
          path: promotion-header-evidence/
          retention-days: 7
