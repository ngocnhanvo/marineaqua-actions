name: Marine Aqua migrate verified informational pages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-information-pages-migration.mjs'
      - '.github/workflows/marineaqua-information-pages-migration.yml'
permissions:
  contents: write
concurrency:
  group: marineaqua-information-pages-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-information-pages-migration.mjs
      - id: migrate-pages
        name: Import only validated source content, preserve existing authored pages
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-information-pages-migration.mjs
      - name: Trigger the existing canonical Astro production pipeline after verified CMS updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"event_type":"wp_trigger_build","client_payload":{"site_domain":"marine-aqua.io.vn"}}' \
            https://api.github.com/repos/ngocnhanvo/marineaqua-actions/dispatches
          echo "CANONICAL_ASTRO_DISPATCH=REQUESTED_AFTER_CMS_PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-information-pages-evidence
          path: information-pages-evidence/
          retention-days: 10

      - name: Publish durable migration run evidence to repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          MIGRATE_OUTCOME: ${{ steps.migrate-pages.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          const file='information-pages-evidence/result.json';
          const evidence=existsSync(file)?JSON.parse(readFileSync(file,'utf8')):{status:'NO_EVIDENCE',results:[],errors:[]};
          const payload={...evidence,run_id:process.env.GH_RUN_ID,run_attempt:process.env.GH_RUN_ATTEMPT,job_outcome:process.env.MIGRATE_OUTCOME,source:'marineaqua-information-pages-migration.yml'};
          const endpoint='https://api.github.com/repos/'+process.env.GH_REPO+'/contents/docs/information-pages-run-latest.json';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const previous=await fetch(endpoint,{headers}).then(r=>r.ok?r.json():null);
          const body={message:'Record page migration workflow run '+process.env.GH_RUN_ID,content:Buffer.from(JSON.stringify(payload,null,2)+String.fromCharCode(10)).toString('base64'),branch:'main'};
          if(previous?.sha)body.sha=previous.sha;
          const response=await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify(body)});
          if(!response.ok)throw Error('Evidence persistence failed '+response.status+' '+(await response.text()).slice(0,160));
          console.log('INFORMATION_PAGES_DURABLE_EVIDENCE='+JSON.stringify({run_id:payload.run_id,status:payload.status,outcome:payload.job_outcome}));
          NODE
