name: Marine Aqua contact page live QA (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-contact-page-live-qa.yml'
      - 'scripts/marineaqua-contact-page-live-qa.mjs'
permissions:
  contents: read
concurrency:
  group: marineaqua-contact-page-live-qa
  cancel-in-progress: false
jobs:
  browser-qa:
    if: github.repository == 'ngocnhanvo/marineaqua-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate QA syntax
        run: node --check scripts/marineaqua-contact-page-live-qa.mjs
      - name: Install matching Playwright
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify published contact page across viewports
        run: node scripts/marineaqua-contact-page-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-contact-page
          path: contact-page-evidence/
          retention-days: 14
