name: Marine Aqua bootstrap WooCommerce cart and checkout Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-checkout-pages-bootstrap.yml'
permissions:
  contents: read
concurrency:
  group: marineaqua-checkout-pages-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'ngocnhanvo/marineaqua-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-checkout-pages-bootstrap.mjs
      - name: Create only missing WordPress cart and checkout Pages with readback
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-checkout-pages-bootstrap.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-checkout-pages-bootstrap
          path: checkout-pages-bootstrap-evidence/
          retention-days: 14
