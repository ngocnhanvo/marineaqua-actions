name: Marine Aqua import one missing promotion product
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-promotion-missing-product.mjs'
      - '.github/workflows/marineaqua-promotion-product-import.yml'
permissions:
  contents: read
concurrency:
  group: marineaqua-promotion-missing-product
  cancel-in-progress: false
jobs:
  import-product:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-promotion-missing-product.mjs
      - name: Import only verified ZETLIGHT product and own media
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-promotion-missing-product.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-promotion-missing-product
          path: promotion-missing-product-evidence/
          retention-days: 7
