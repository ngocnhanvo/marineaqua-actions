name: Marine Aqua PHP deployment (manual opt-in)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_PHP to allow WordPress PHP upload (no Astro build)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: marineaqua-wp-php-release
  cancel-in-progress: false
jobs:
  wordpress-php:
    if: github.repository == 'ngocnhanvo/marineaqua-actions' && inputs.confirm == 'DEPLOY_PHP'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout MARINE AQUA Actions deploy script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout only MARINE AQUA WordPress PHP master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/marineaqua-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: PHP syntax and project identity
        shell: bash
        run: |
          set -euo pipefail
          php -l source-php/marineaqua-image-delta.php
          php -l source-php/marineaqua-unzip.php
          php source-php/tests/marineaqua-image-delta.php
          php source-php/tests/marineaqua-static-delta.php
          php -l source-php/wp-content/plugins/esc-visual-builder/includes/site-config.php
          php -l source-php/tests/visual-builder-product-section-title.test.php
          php source-php/tests/visual-builder-product-section-title.test.php
          php -l source-php/wp-content/plugins/github-trigger/vcs-build-trigger.php
          php -l source-php/wp-content/mu-plugins/esc-github-trigger-config.php
          php -l source-php/wp-content/mu-plugins/esc-seo-files.php
          php -l source-php/wp-content/mu-plugins/marineaqua-product-sale-rest.php
          php -l source-php/wp-content/themes/vibe-code-theme/inc/user/account-login.php
          php source-php/tests/customer-login.test.php
          php -l source-php/wp-content/themes/vibe-code-theme/inc/checkout/checkout_endpoint.php
          php -l source-php/wp-content/themes/vibe-code-theme/inc/tools/payment-gateways.php
          php source-php/tests/checkout-preflight.test.php
          php source-php/tests/payment-gateway-read.test.php
          php -l scripts/marineaqua-checkout-cod-contract.test.php
          php scripts/marineaqua-checkout-cod-contract.test.php source-php
          ! grep -Eqi 'nghiencuukhoahoc|EduResearch Hub' source-php/wp-content/mu-plugins/esc-seo-files.php
          php -l source-php/wp-content/plugins/github-trigger/tests/build-status-regression.php
          php source-php/wp-content/plugins/github-trigger/tests/build-status-regression.php
          test "$(cat source-php/marineaqua-unzip-v2.ready)" = 'MARINEAQUA_ASTRO_UNZIP_PROTOCOL=2'
          python3 -m py_compile scripts/marineaqua-php-live-release.py
      - name: Release only MARINE AQUA WordPress PHP files with protected FTPS
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/marineaqua-php-live-release.py
      - name: Probe configured WordPress unzip ready marker (NO BUILD)
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, ssl, time
          from urllib.parse import urlsplit
          from urllib.request import HTTPSHandler, HTTPRedirectHandler, Request, build_opener
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None
          values=[]
          for line in os.environ['ENV_FILE'].splitlines():
              if line.strip().startswith('WC_URL='):
                  values.append(line.split('=',1)[1].strip().strip('"').strip("'"))
          if len(values)!=1:
              raise RuntimeError('Expected one WordPress WC_URL in ENV_FILE')
          parsed=urlsplit(values[0])
          if not (parsed.scheme=='https' and parsed.hostname
              and not parsed.username and not parsed.password and parsed.port in (None,443)
              and parsed.path in ('','/') and not parsed.query and not parsed.fragment):
              raise RuntimeError('Invalid WordPress HTTPS origin in ENV_FILE')
          client=build_opener(HTTPSHandler(context=ssl.create_default_context()),NoRedirect)
          url=parsed.geturl().rstrip('/')+'/marineaqua-unzip-v2.ready'
          for attempt in range(3):
              try:
                  with client.open(Request(url,method='GET'),timeout=20) as response:
                      if response.status==200 and response.read(100).strip()==b'MARINEAQUA_ASTRO_UNZIP_PROTOCOL=2':
                          print('MARINEAQUA_WP_UNZIP_READY_MARKER=PASS')
                          break
              except Exception:
                  pass
              if attempt==2:
                  raise RuntimeError('Configured WP unzip readiness endpoint unavailable')
              time.sleep(3)
          PY
