name: Marine Aqua safely trash abandoned promotion drafts
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-promotion-abandoned-drafts-cleanup.mjs'
      - '.github/workflows/marineaqua-promotion-drafts-cleanup.yml'
permissions:
  contents: read
concurrency:
  group: marineaqua-promotion-draft-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-promotion-abandoned-drafts-cleanup.mjs
      - name: Trash only verified empty promotion drafts from abandoned plan
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-promotion-abandoned-drafts-cleanup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-promotion-draft-cleanup
          path: promotion-drafts-cleanup-evidence/
          retention-days: 7
