name: Marine Aqua import verified brand product galleries
on:
  # Archived legacy alternate path: manual-only to prevent two gallery writers.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: marine-aqua-woocommerce-brand-import
  cancel-in-progress: false
jobs:
  gallery:
    if: >-
      github.repository == 'ngocnhanvo/marineaqua-actions'
      && (github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-import-brand-galleries.mjs
      - name: Fetch immutable original gallery manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p brand-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13917609900/zip" --output /tmp/brand-manifest.zip
          python3 -m zipfile -e /tmp/brand-manifest.zip brand-catalog-evidence
          test -s brand-catalog-evidence/manifest.json
      - name: Upload and verify all original gallery media via WordPress
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-import-brand-galleries.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-brand-gallery-migration
          path: brand-gallery-evidence/
          retention-days: 14
