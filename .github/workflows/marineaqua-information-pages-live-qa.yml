name: Marine Aqua informational pages live QA after production deploy
on:
  workflow_run:
    workflows:
      - 'Marine Aqua Astro deployment (WordPress Build Website only)'
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-information-pages-live-qa.mjs
      - run: node scripts/marineaqua-information-pages-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-information-pages-live-qa
          path: information-pages-live-evidence/
          retention-days: 10
