name: Marine Aqua four categories full original gallery parity (NO DEPLOY)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-four-category-gallery-parity.mjs'
      - '.github/workflows/marineaqua-four-category-gallery-parity.yml'
permissions:
  contents: read
  actions: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-four-category-gallery-parity.mjs
      - name: Restore immutable source galleries and catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for pair in "13942597917 four-category-catalog-evidence" "13943072582 four-category-gallery-source-evidence"; do
            set -- $pair
            mkdir -p "$2"
            curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/$1/zip" -o "/tmp/$1.zip"
            python3 -m zipfile -e "/tmp/$1.zip" "$2"
          done
      - name: Verify all original fullsize gallery images and order for 15 products
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-four-category-gallery-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-four-category-gallery-parity
          path: four-category-gallery-parity-evidence/
          retention-days: 14
