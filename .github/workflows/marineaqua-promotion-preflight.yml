name: Marine Aqua promotion source and CMS inventory (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-promotion-preflight.mjs'
      - '.github/workflows/marineaqua-promotion-preflight.yml'
permissions:
  contents: read
concurrency:
  group: marineaqua-promotion-preflight
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-promotion-preflight.mjs
      - name: Read source product slugs, target IDs and native editor controls
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-promotion-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-promotion-preflight
          path: promotion-preflight-evidence/
          retention-days: 7
