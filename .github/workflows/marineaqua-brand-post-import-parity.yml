name: Marine Aqua brand catalog parity after import
on:
  workflow_run:
    workflows: ["Marine Aqua import verified brand products batch"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  parity:
    if: github.repository == 'ngocnhanvo/marineaqua-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-brand-post-import-parity.mjs
      - name: Retrieve immutable source inventory and taxonomy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p brand-catalog-evidence brand-taxonomy-mapping-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13917609900/zip" --output /tmp/brand-products.zip
          python3 -m zipfile -e /tmp/brand-products.zip brand-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13918288250/zip" --output /tmp/brand-mapping.zip
          python3 -m zipfile -e /tmp/brand-mapping.zip brand-taxonomy-mapping-evidence
          test -s brand-catalog-evidence/manifest.json
          test -s brand-taxonomy-mapping-evidence/mapping.json
      - name: Compare all source products with live WooCommerce (READ ONLY)
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-brand-post-import-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-brand-post-import-parity
          path: brand-post-import-parity-evidence/
          retention-days: 14
