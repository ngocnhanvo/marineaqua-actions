name: Marine Aqua brand listing post-deploy QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-brand-postdeploy-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post-deploy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-brand-postdeploy-qa.mjs
      - run: node scripts/marineaqua-brand-postdeploy-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-brand-postdeploy-qa
          path: brand-postdeploy-qa-evidence/
