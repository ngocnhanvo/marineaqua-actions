name: Marine Aqua sharing Posts progress audit (read only)
# Recheck content-only migration count after stopping the superseded image importer
# Verify article count while the final source-backed migration completes
# Refresh read-only migration progress after category Page parity review
# Check new publishing batch without editing any WordPress record
# Track final sharing Post import batches after reaching eighty
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-sharing-progress-audit.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read source and target published Posts counts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          const fetchTotal=async origin=>{
           const res=await fetch(origin+'/wp-json/wp/v2/posts?status=publish&per_page=1&_fields=id');
           if(!res.ok)throw Error(origin+' Posts HTTP '+res.status);
           return Number(res.headers.get('X-WP-Total')||0);
          };
          const source=await fetchTotal('https://marine-aqua.vn');
          const target=await fetchTotal('https://admin.marine-aqua.io.vn');
          const sampleResponse=await fetch('https://admin.marine-aqua.io.vn/wp-json/wp/v2/posts?status=publish&per_page=1&_fields=id,slug,acf,featured_media,content');
          if(!sampleResponse.ok)throw Error('Post readback '+sampleResponse.status);
          const examples=await sampleResponse.json();
          const sample=examples[0]?{id:examples[0].id,slug:examples[0].slug,acf:examples[0].acf,featured_media:examples[0].featured_media,content_length:String(examples[0].content?.rendered||'').length}:null;
          const payload={run_id:process.env.GH_RUN_ID,source,target,expected:133,complete:target===133,sample};
          const endpoint='https://api.github.com/repos/'+process.env.GH_REPO+'/contents/docs/sharing-progress-latest.json';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const previous=await fetch(endpoint,{headers}).then(r=>r.ok?r.json():null);
          const body={message:'Record sharing Posts import progress '+payload.run_id,content:Buffer.from(JSON.stringify(payload,null,2)+String.fromCharCode(10)).toString('base64'),branch:'main'};
          if(previous?.sha)body.sha=previous.sha;
          const result=await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify(body)});
          if(!result.ok)throw Error('Progress evidence HTTP '+result.status);
          console.log('SHARING_POSTS_PROGRESS='+JSON.stringify(payload));
          NODE
