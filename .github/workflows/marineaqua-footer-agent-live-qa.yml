name: Marine Aqua footer Agent removal production QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-footer-agent-live-qa.yml'
      - 'scripts/marineaqua-footer-agent-live-qa.mjs'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: marineaqua-footer-agent-removal-qa
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ngocnhanvo/marineaqua-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install matching browser driver only
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Production SHA audit and read-only desktop/mobile browser QA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/marineaqua-footer-agent-live-qa.mjs
      - name: Publish limited non-secret QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marineaqua-footer-agent-live-qa
          path: footer-agent-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Persist final QA outcome for checkpoint and verification
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const path = 'qa-results/20261113-footer-agent-removal.json';
            const evidence = 'footer-agent-evidence/result.json';
            const fallback = {status:'FAIL',failures:['QA process did not emit result.json']};
            const data = fs.existsSync(evidence) ? JSON.parse(fs.readFileSync(evidence,'utf8')) : fallback;
            data.qa_run_id = context.runId;
            data.qa_run_attempt = process.env.GITHUB_RUN_ATTEMPT;
            data.qa_run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            data.recorded_at = new Date().toISOString();
            const owner=context.repo.owner, repo=context.repo.repo;
            let sha;
            try {
              const old=await github.rest.repos.getContent({owner,repo,path,ref:'main'});
              sha=old.data.sha;
            } catch(err) {if(err.status!==404) throw err;}
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch:'main', sha,
              message:'Ghi kết quả QA footer và Agent',
              content:Buffer.from(JSON.stringify(data,null,2)+'\n').toString('base64'),
            });
