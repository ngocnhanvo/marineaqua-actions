name: Marine Aqua PHP FTPS read-only audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-php-ftps-audit.yml'
      - 'scripts/marineaqua-php-ftps-audit.py'
permissions:
  contents: read
concurrency:
  group: marineaqua-php-ftps-audit
  cancel-in-progress: false

jobs:
  compare-remote-php:
    name: Compare approved PHP files against WordPress FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Marine Aqua Actions audit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout Marine Aqua PHP master (read-only)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/marineaqua-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Audit source at WordPress FTPS (NO WRITES)
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/marineaqua-php-ftps-audit.py
          python3 scripts/marineaqua-php-ftps-audit.py
      - name: Validate build origins and signed unzip preflight (READ ONLY)
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          values = {}
          for line in os.environ['ENV_FILE'].splitlines():
              line = line.strip()
              if line.startswith('export '):
                  line = line[7:].strip()
              for key in ('WC_URL', 'WC_URL_CLIENT'):
                  if line.startswith(key + '='):
                      if key in values:
                          raise SystemExit('Duplicate build origin: ' + key)
                      values[key] = line.split('=', 1)[1].strip().strip("\"'")
          required = {'WC_URL': 'admin.marine-aqua.io.vn', 'WC_URL_CLIENT': 'marine-aqua.io.vn'}
          for key, expected in required.items():
              parsed = urlsplit(values.get(key, ''))
              if (parsed.scheme != 'https' or parsed.hostname != expected
                      or parsed.username or parsed.password or parsed.port not in (None, 443)
                      or parsed.path not in ('', '/') or parsed.query or parsed.fragment):
                  raise SystemExit('Marine Aqua origin mismatch in ' + key)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write('ASTRO_FTP_TARGET=/domains/marine-aqua.io.vn/public_html/\n')
          print('MARINEAQUA_BUILD_CONFIG origins=PASS expected_project=PASS')
          PY
          export ASTRO_FTP_TARGET=/domains/marine-aqua.io.vn/public_html/
          python3 -m py_compile scripts/marineaqua-remote-unzip.py
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          url = 'https://admin.marine-aqua.io.vn/marineaqua-unzip-v2.ready'
          expected = b'MARINEAQUA_ASTRO_UNZIP_PROTOCOL=2'
          try:
              with opener.open(urllib.request.Request(url, method='GET'), timeout=15) as response:
                  body = response.read(2048)
                  print('MARINEAQUA_HTTP_MARKER status=' + str(response.status)
                        + ' bytes=' + str(len(body)) + ' marker_match=' + str(body.strip()==expected))
          except urllib.error.HTTPError as exc:
              print('MARINEAQUA_HTTP_MARKER status=' + str(exc.code) + ' marker_match=False')
          except Exception as exc:
              print('MARINEAQUA_HTTP_MARKER error_class=' + type(exc).__name__)
          PY
          python3 - <<'PY'
          import hashlib, hmac, json, os, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          body = json.dumps({'action':'check', 'host':'marine-aqua.io.vn',
            'target':'/domains/marine-aqua.io.vn/public_html/', 'allow_override':False},
            sort_keys=True, separators=(',', ':')).encode('utf-8')
          now = str(int(time.time()))
          token = os.environ.get('SOURCE_REPO_PAT', '')
          if len(token) < 20:
              raise SystemExit('MARINEAQUA_SIGNED_CHECK token_unavailable')
          signature = hmac.new(token.encode(), now.encode()+b'\n'+body, hashlib.sha256).hexdigest()
          req = Request('https://admin.marine-aqua.io.vn/marineaqua-unzip.php',
            data=body, method='POST', headers={
              'Content-Type':'application/json',
              'X-Esc-Deploy-Timestamp':now,
              'X-Esc-Deploy-Signature':signature})
          try:
              with urlopen(req, timeout=20) as response:
                  data = json.loads(response.read(4096))
                  approved = (response.status==200 and data.get('ok') is True
                      and data.get('protocol')==2 and data.get('host')=='marine-aqua.io.vn'
                      and data.get('target')=='/domains/marine-aqua.io.vn/public_html/')
                  print('MARINEAQUA_SIGNED_CHECK http_status=' + str(response.status)
                        + ' approved=' + str(approved))
          except HTTPError as error:
              raw = error.read(1000)
              try:
                  reason = json.loads(raw).get('error', '')
              except (ValueError, AttributeError):
                  reason = ''
              whitelist = {
                  'GitHub repository routing is not configured': 'REPO_ROUTING_MISSING',
                  'Invalid signed request': 'AUTH_SIGNATURE_REJECTED',
                  'Template frontend destination lock failed': 'FRONTEND_DOMAIN_MISMATCH',
                  'Deploy authentication not configured': 'DEPLOY_KEY_MISSING',
              }
              print('MARINEAQUA_SIGNED_CHECK http_status=' + str(error.code)
                    + ' reason=' + whitelist.get(reason, 'OTHER') + ' approved=False')
          except (URLError, ValueError, TimeoutError) as error:
              print('MARINEAQUA_SIGNED_CHECK error_class=' + type(error).__name__)
          PY
          python3 scripts/marineaqua-remote-unzip.py verify
          echo 'MARINEAQUA_BUILD_CONFIG signed_preflight=PASS mode=READ_ONLY'
