name: Marine Aqua Astro build validation (NO DEPLOY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-astro-build-qa.yml'
permissions:
  contents: read
concurrency:
  group: marineaqua-astro-build-validation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - name: Verify environment is configured
        run: |
          test -n "$ENV_FILE" || { echo "::error::Missing ENV_FILE"; exit 1; }
      - name: Checkout production Astro master only
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/marineaqua-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      # Revalidate build with restored React route modules and WordPress types.
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = master
          echo "Astro QA build source: $(git rev-parse HEAD) (master)" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build from real WordPress data without deploying
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$ENV_FILE" > .env
          chmod 600 .env
          pnpm run build-git
          test -s dist/client/index.html
          test -s dist/server/entry.mjs
          node --check dist/server/entry.mjs
          test -s dist/client/sitemap.xml
          test -s dist/client/robots.txt
          test -s dist/client/llms.txt
          echo 'ASTRO_PRODUCTION_EQUIVALENT_BUILD=PASS (NO FTP, NO DEPLOY)' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify published WordPress Header menu for every published locale
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlsplit
          env = os.environ['ENV_FILE']
          wp_values = [line.strip().split('=', 1)[1].strip().strip("\"'") for line in env.splitlines() if line.strip().startswith('WC_URL=')]
          if len(wp_values) != 1:
              raise SystemExit('CMS_HEADER_MENU=FAIL invalid WordPress origin configuration')
          host = urlsplit(wp_values[0]).hostname
          if host != 'admin.marine-aqua.io.vn':
              raise SystemExit('CMS_HEADER_MENU=FAIL unexpected WordPress host')
          url = 'https://' + host + '/wp-json/esc-api/v1/menus'
          with urlopen(Request(url, headers={'Accept':'application/json'}), timeout=20) as response:
              data = json.loads(response.read(1000001))
          if not isinstance(data, dict) or data.get('success') is not True:
              raise SystemExit('CMS_HEADER_MENU=FAIL invalid WordPress menu API response')
          header = (data.get('menus') or {}).get('Header', {})
          if not isinstance(header, dict):
              raise SystemExit('CMS_HEADER_MENU=FAIL Header is not defined')
          cache = Path('dist/client/data/cms-common.json')
          if not cache.is_file():
              raise SystemExit('CMS_HEADER_MENU=FAIL missing published page index')
          published = json.loads(cache.read_text())
          locales = {str(p.get('lang')) for p in published.get('pages', []) if isinstance(p, dict) and p.get('lang')}
          if not locales:
              raise SystemExit('CMS_HEADER_MENU=FAIL no published page locales found')
          missing = [lang for lang in sorted(locales) if not isinstance(header.get(lang), dict)
                     or not isinstance(header[lang].get('items'), list) or not header[lang]['items']]
          print('CMS_HEADER_MENU published_locales=' + str(len(locales)) + ' usable_header_locales=' + str(len(locales)-len(missing)))
          if missing:
              raise SystemExit('CMS_HEADER_MENU=FAIL missing_locales=' + ','.join(missing))
          print('CMS_HEADER_MENU=PASS wordpress_source_only')
          PY
      - name: Erase ephemeral environment file
        if: always()
        shell: bash
        run: rm -f .env
