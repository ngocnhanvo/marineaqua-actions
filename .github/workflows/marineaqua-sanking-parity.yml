name: Marine Aqua Sanking independent WooCommerce parity
on:
  workflow_run:
    workflows: ["Marine Aqua import verified Sanking catalog"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  parity:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-sanking-parity.mjs
      - name: Recover independent immutable source, mapping and price evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for pair in "13940113224 sanking-catalog-evidence" "13940688222 sanking-mapping-evidence" "13940758307 sanking-price-oracle-evidence"; do
            set -- $pair
            mkdir -p "$2"
            curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/$1/zip" -o "/tmp/$1.zip"
            python3 -m zipfile -e "/tmp/$1.zip" "$2"
          done
      - name: Compare all 96 Sanking source records to target WooCommerce
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-sanking-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-sanking-parity
          path: sanking-parity-evidence/
          retention-days: 14
