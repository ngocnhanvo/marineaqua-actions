name: Marine Aqua publish seven sharing Header links after Posts migration
on:
  workflow_run:
    workflows:
      - Marine Aqua migrate 133 sharing posts and seven categories
    types: [completed]
permissions:
  contents: write
  actions: write
concurrency:
  group: marineaqua-sharing-header-release
  cancel-in-progress: false
jobs:
  bind:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-sharing-header.mjs
      - id: binding
        name: Verify all 133 articles and bind seven existing WordPress Header items
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-sharing-header.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marineaqua-sharing-header
          path: sharing-header-evidence/
          retention-days: 12
      - name: Persist verified WordPress Header result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ steps.binding.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          const p='sharing-header-evidence/result.json';
          const report=existsSync(p)?JSON.parse(readFileSync(p,'utf8')):{status:'NO_EVIDENCE',errors:['No result']};
          report.run_id=process.env.GH_RUN_ID;report.outcome=process.env.OUTCOME;
          const endpoint='https://api.github.com/repos/'+process.env.GH_REPO+'/contents/docs/sharing-header-latest.json';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const old=await fetch(endpoint,{headers}).then(r=>r.ok?r.json():null);
          const body={message:'Record sharing Header verification '+report.run_id,content:Buffer.from(JSON.stringify(report,null,2)+String.fromCharCode(10)).toString('base64'),branch:'main'};
          if(old?.sha)body.sha=old.sha;
          const result=await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify(body)});
          if(!result.ok)throw Error('Cannot persist sharing Header result '+result.status);
          NODE
      - name: Trigger only the existing canonical Astro production pipeline
        if: steps.binding.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const uri='https://api.github.com/repos/'+process.env.GH_REPO+'/dispatches';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const payload={event_type:'wp_trigger_build',client_payload:{site_domain:'marine-aqua.io.vn'}};
          const response=await fetch(uri,{method:'POST',headers,body:JSON.stringify(payload)});
          if(response.status!==204)throw Error('Canonical production dispatch rejected '+response.status+' '+(await response.text()).slice(0,200));
          console.log('SHARING_CANONICAL_ASTRO_BUILD_DISPATCH_ACCEPTED');
          NODE
