name: Marine Aqua commerce native editor read-only diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marineaqua-commerce-editor-probe.yml'
      - 'scripts/marineaqua-commerce-editor-probe.mjs'
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'ngocnhanvo/marineaqua-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/marineaqua-commerce-editor-probe.mjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Inspect native Editor without saving
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-commerce-editor-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commerce-editor-probe
          path: artifacts/commerce-editor-probe/
          retention-days: 14
