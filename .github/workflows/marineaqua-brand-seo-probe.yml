name: Marine Aqua read-only product SEO metadata probe
on:
  push:
    branches: [main]
    paths:
      - 'scripts/marineaqua-brand-seo-probe.mjs'
      - '.github/workflows/marineaqua-brand-seo-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  seo-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-brand-seo-probe.mjs
      - name: Restore source SEO baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p brand-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13917609900/zip" --output /tmp/products.zip
          python3 -m zipfile -e /tmp/products.zip brand-catalog-evidence
      - name: Compare real WooCommerce Yoast metadata, read only
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-brand-seo-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-brand-seo-probe
          path: brand-seo-probe-evidence/
