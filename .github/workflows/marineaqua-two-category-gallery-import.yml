name: Marine Aqua two category restore original galleries
on:
  workflow_run:
    workflows: ["Marine Aqua import two verified product category trees"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gallery:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: marine-aqua-woocommerce-brand-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: node --check scripts/marineaqua-two-category-gallery-import.mjs
      - name: Recover verified original gallery and catalog snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p two-category-catalog-evidence two-category-gallery-source-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13929359331/zip" --output /tmp/source.zip
          python3 -m zipfile -e /tmp/source.zip two-category-catalog-evidence
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/ngocnhanvo/marineaqua-actions/actions/artifacts/13929634487/zip" --output /tmp/gallery.zip
          python3 -m zipfile -e /tmp/gallery.zip two-category-gallery-source-evidence
          echo "TWO_CATEGORY_GALLERY_SNAPSHOTS=PASS"
          test -s two-category-catalog-evidence/manifest.json
          test -s two-category-gallery-source-evidence/manifest.json
      - name: Import only missing source gallery assets and verify WooCommerce readback
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/marineaqua-two-category-gallery-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-aqua-two-category-gallery-import
          path: two-category-gallery-import-evidence/
          retention-days: 14
